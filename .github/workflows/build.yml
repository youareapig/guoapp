name: Build Android

# 手动触发:Actions 页面 → Build Android → Run workflow
on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: 'true = 全站源版 / false = 仅红果版'
        type: boolean
        default: true
      abi:
        description: 'arm64-v8a=现代手机 | armeabi-v7a=老手机/电视 | all=三架构(慢)'
        type: choice
        default: all
        options: [all, arm64-v8a, armeabi-v7a, x86_64]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 缓存 Gradle 与 Android SDK,第二次构建能省一大截
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-android-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'

      # 签名可选:配了 Secrets 就用你自己的证书;
      # 没配也能编 —— build.gradle.kts 会自动回落到 runner 自带的 debug keystore。
      - name: Configure Android signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::未配置签名 Secrets,将使用 debug keystore 签名(runner 自带,可正常安装)。"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build native Go core + APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC=""
          [ "${{ inputs.all_sources }}" = "true" ] && SRC="--all-sources"
          ABI=""
          if [ "${{ inputs.abi }}" != "all" ]; then
            ABI="--abi ${{ inputs.abi }}"
          fi
          echo "构建参数: $SRC $ABI"
          python scripts/build_android.py $SRC $ABI

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.version }}-${{ inputs.abi }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release (可选,失败不影响 APK)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="my-build-v${VERSION}-${{ inputs.abi }}-$GITHUB_RUN_NUMBER"
          gh release create "$tag" dist/android/*.apk --title "自编译 $VERSION" --notes "Run #$GITHUB_RUN_NUMBER"
