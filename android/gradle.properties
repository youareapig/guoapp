org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# 代理/回环兼容:强制 IPv4,避免 Gradle daemon 连不上本地回环
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|*.local
systemProp.https.nonProxyHosts=localhost|127.*|[::1]|*.local
